name: ROS 2 Jazzy CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  ROS_PROJECT_NAME: ${{ vars.ROS_PROJECT_NAME || github.event.repository.name }}
  ROS_PACKAGE_PREFIX: ${{ vars.ROS_PACKAGE_PREFIX || vars.ROS_PROJECT_NAME || github.event.repository.name }}
  ROS_MSGS_PACKAGE: ${{ vars.ROS_MSGS_PACKAGE || '' }}

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        ros_distro: [jazzy]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Setup ROS 2
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.ros_distro }}

      - name: Install dependencies
        run: |
          sudo apt update
          vcs import --input build_depends.repos --recursive .
          rosdep update --rosdistro ${{ matrix.ros_distro }}
          rosdep install --from-paths . --ignore-src -r -y --rosdistro ${{ matrix.ros_distro }}

      - name: Format code
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          # Format C++ files only in our packages (avoiding install/, dep/, etc.)
          find . -maxdepth 1 -type d -name "${ROS_PACKAGE_PREFIX}_*" | xargs ament_clang_format --reformat || true

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto formatting"
          file_pattern: '*'

      - name: Build with colcon
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          MSGS_PACKAGE="${ROS_MSGS_PACKAGE:-${ROS_PACKAGE_PREFIX}_msgs}"
          if colcon list --names-only | grep -qx "$MSGS_PACKAGE"; then
            colcon build --packages-select "$MSGS_PACKAGE" --symlink-install
            source install/setup.bash
            export PYTHONPATH=/opt/ros/${{ matrix.ros_distro }}/lib/python3.12/site-packages:$PYTHONPATH
          fi
          colcon build --event-handlers console_direct+ --symlink-install


      - name: Run tests
        run: |
          source install/setup.bash
          ALL_PKGS=$(colcon list --names-only | xargs)
          TARGET_PKGS=$(printf '%s\n' $ALL_PKGS | grep "^${ROS_PACKAGE_PREFIX}" | xargs || true)

          if [ -z "$TARGET_PKGS" ]; then
            TARGET_PKGS="$ALL_PKGS"
            echo "No packages starting with '${ROS_PACKAGE_PREFIX}' found. Falling back to all packages."
          fi

          if [ -z "$TARGET_PKGS" ]; then
            echo "No packages found. Skipping tests."
            echo "SKIP_TEST_RESULTS=1" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Target packages for testing: $TARGET_PKGS"
          colcon test --packages-select $TARGET_PKGS --event-handlers console_direct+ --return-code-on-test-failure

      - name: Check test results
        if: env.SKIP_TEST_RESULTS != '1'
        run: colcon test-result --verbose
