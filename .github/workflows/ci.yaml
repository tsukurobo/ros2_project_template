name: ROS 2 Jazzy CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        ros_distro: [jazzy]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}
          submodules: recursive

      - name: Set project names
        run: |
          REPOSITORY_NAME="${GITHUB_REPOSITORY##*/}"
          PROJECT_NAME="${REPOSITORY_NAME%_ros2}"
          echo "PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_ENV"
          echo "PACKAGE_PREFIX=$PROJECT_NAME" >> "$GITHUB_ENV"
          echo "MSGS_PACKAGE=${PROJECT_NAME}_msgs" >> "$GITHUB_ENV"

      - name: Setup ROS 2
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.ros_distro }}

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y pre-commit
          vcs import --input build_depends.repos --recursive .
          rosdep update --rosdistro ${{ matrix.ros_distro }}
          rosdep install --from-paths . --ignore-src -r -y --rosdistro ${{ matrix.ros_distro }}

      - name: Format code
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          pre-commit run --all-files || true

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "style: auto formatting"
          file_pattern: '*'

      - name: Build with colcon
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          if colcon list --names-only | grep -qx "$MSGS_PACKAGE"; then
            colcon build --packages-select "$MSGS_PACKAGE" --symlink-install
            source install/setup.bash
            export PYTHONPATH=/opt/ros/${{ matrix.ros_distro }}/lib/python3.12/site-packages:$PYTHONPATH
          fi
          colcon build --event-handlers console_direct+ --symlink-install


      - name: Run tests
        run: |
          source install/setup.bash
          ALL_PKGS=$(colcon list --names-only | xargs)
          TARGET_PKGS=$(printf '%s\n' $ALL_PKGS | grep -E "^${PACKAGE_PREFIX}(_|$)" | xargs || true)

          if [ -z "$TARGET_PKGS" ]; then
            TARGET_PKGS="$ALL_PKGS"
            echo "No packages starting with '${PACKAGE_PREFIX}' found. Falling back to all packages."
          fi

          if [ -z "$TARGET_PKGS" ]; then
            echo "No packages found. Skipping tests."
            echo "SKIP_TEST_RESULTS=1" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Target packages for testing: $TARGET_PKGS"
          colcon test --packages-select $TARGET_PKGS --event-handlers console_direct+ --return-code-on-test-failure

      - name: Check test results
        if: env.SKIP_TEST_RESULTS != '1'
        run: colcon test-result --verbose
